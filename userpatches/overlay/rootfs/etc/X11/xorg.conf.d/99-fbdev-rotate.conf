# KlipperScreen on the gud-esp32s3 display, rotated CCW (see the gud-esp32s3 README).
Section "Device"
    Identifier "gud-fbdev-rotated"
    Driver     "fbdev"
    Option     "fbdev"  "/dev/fb0"
    Option     "Rotate" "CCW"
EndSection

Section "Screen"
    Identifier "gud-screen"
    Device     "gud-fbdev-rotated"
EndSection

Section "ServerLayout"
    Identifier "gud-layout"
    Screen     "gud-screen"
EndSection
