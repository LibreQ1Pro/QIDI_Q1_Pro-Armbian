# Settings of customize-image.sh. Repositories are cloned from these URLs at build time,
# so push local commits first.

PRINTER_UID=1000
PRINTER_GID=1000
PRINTER_USER=mks
PRINTER_PASSWORD=makerbase

KIAUH_REPO=https://github.com/dw-0/kiauh.git
KIAUH_BRANCH=master

KLIPPER_REPO=https://github.com/LibreQ1Pro/klipper
KLIPPER_BRANCH=master

KLIPPERSCREEN_REPO=https://github.com/LibreQ1Pro/KlipperScreen.git
TIMELAPSE_REPO=https://github.com/mainsail-crew/moonraker-timelapse.git
CROWSNEST_REPO=https://github.com/mainsail-crew/crowsnest.git

KATAPULT_REPO=https://github.com/LibreQ1Pro/katapult.git
KATAPULT_BRANCH=master

LIBRESCREEN_REPO=https://github.com/LibreQ1Pro/librescreen.git
LIBRESCREEN_BRANCH=main
LIBRESCREEN_DIR=LibreScreen

# printer.cfg and gcode_macro.cfg, firmware .config files
PRINTER_CONFIG_REPO=https://github.com/LibreQ1Pro/QIDI_Q1_Pro-Config.git
PRINTER_CONFIG_BRANCH=main

# MCU firmware (Katapult, Klipper, screen) and QIDI's original MCU firmware, cloned next to it
PRINTER_FIRMWARE_REPO=https://github.com/LibreQ1Pro/QIDI_Q1_Pro-Firmware.git
PRINTER_STOCK_FIRMWARE_REPO=https://github.com/LibreQ1Pro/QIDI_Q1_Pro-Stock-Firmware.git

MAINSAIL_PORT=80
FLUIDD_PORT=81

INSTALL_FLUIDD=yes
INSTALL_KLIPPERSCREEN=yes
INSTALL_CROWSNEST=yes

AIC8800_DEBS="
https://github.com/LibreQ1Pro/aic8800/releases/download/5.0%2Bgit20260123.5f7be68d-12/aic8800-firmware_5.0+git20260123.5f7be68d-12_all.deb
