# Armbian build config for the QIDI Q1 Pro (MKS-PI, RK3328; board qidi-x6), used by ../build.sh.
# Everything on top of Armbian is in customize-image.sh, its settings in overlay/libreq1pro.conf.

BOARD=qidi-x6
BRANCH=current
RELEASE=trixie
BUILD_MINIMAL=no
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
# For the aic8800 DKMS module
INSTALL_HEADERS=yes
# Klipper, KIAUH, LibreScreen... are in /home/mks; Armbian leaves /home out by default
INCLUDE_HOME_DIR=yes

# customize-image.sh sets up NetworkManager itself; Armbian's stack would install netplan.io
NETWORKING_STACK=none
HOST=qidi-q1-pro

# No console or getty on the printer UARTs (ttyS0 mainboard, ttyS1 display, ttyS2 toolhead);
# tty1 is the only console Armbian skips for serial gettys
SERIALCON=tty1

# Armbian adds 30% free space; the root filesystem grows to the whole eMMC on first boot anyway
function config_prepare_image_size__libreq1pro_tight() {
	declare -g FIXED_IMAGE_SIZE=$(( (rootfs_size * 115 / 100 + 256 + OFFSET + BOOTSIZE + 3) / 4 * 4 ))
	display_alert "libreq1pro image size" "${FIXED_IMAGE_SIZE} MiB for ${rootfs_size} MiB rootfs" "info"
}

# ARMBIAN_REF pins only the patch set, a newer 6.18.y can already contain a patch and stop the build
# (6.18.63): pin the kernel to the tested version together with ARMBIAN_REF
KERNELBRANCH="tag:v6.18.62"

# For usb-first.cmd: i2c (boot LEDs), regulator (USB power), sysboot (extlinux) and the USB2 PHY
# driver, without which U-Boot enumerates no USB devices
function post_config_uboot_target__libreq1pro_boot_cmds() {
	run_host_command_logged scripts/config --enable CONFIG_CMD_I2C --enable CONFIG_CMD_REGULATOR \
		--enable CONFIG_CMD_SYSBOOT --enable CONFIG_PHY_ROCKCHIP_INNO_USB2
}
